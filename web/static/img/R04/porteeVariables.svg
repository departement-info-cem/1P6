<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" role="img" aria-labelledby="titre description">
  <title id="titre">Portée d'un champ, d'une variable locale et d'une variable de bloc en C#</title>
  <desc id="description">Le champ statique c appartient à Program. La variable a est déclarée dans Main. La variable b est déclarée après l'accolade ouvrante d'un bloc intérieur et n'est accessible que dans ce bloc.</desc>
  <rect width="850" height="500" rx="16" fill="#fff"/>
  <rect x="20" y="22" width="480" height="456" rx="18" fill="#e5eefb" stroke="#5579ab" stroke-width="2"/>
  <rect x="52" y="145" width="423" height="300" rx="14" fill="#e8f3df" stroke="#628544" stroke-width="2"/>
  <rect x="78" y="248" width="372" height="128" rx="12" fill="#fff0db" stroke="#b87924" stroke-width="2"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#192533">
    <text x="38" y="56">class Program</text>
    <text x="38" y="85">{</text>
    <text x="62" y="117">static int c = 42;</text>
    <text x="62" y="177">static void Main()</text>
    <text x="62" y="206">{</text>
    <text x="86" y="236">int a = 10;</text>
    <text x="86" y="277">{</text>
    <text x="110" y="307">int b = 5;</text>
    <text x="110" y="337">Console.WriteLine(b);</text>
    <text x="86" y="366">}</text>
    <text x="86" y="405">Console.WriteLine(a);</text>
    <text x="62" y="435">}</text>
    <text x="38" y="467">}</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#192533">
    <text x="535" y="87" font-size="22" font-weight="bold">Champ de classe : c</text>
    <text x="535" y="117" font-size="18">Accessible dans les méthodes</text>
    <text x="535" y="142" font-size="18">de la classe Program.</text>
    <text x="535" y="213" font-size="22" font-weight="bold">Variable de méthode : a</text>
    <text x="535" y="243" font-size="18">Accessible après sa déclaration</text>
    <text x="535" y="268" font-size="18">dans Main, y compris dans le bloc.</text>
    <text x="535" y="337" font-size="22" font-weight="bold">Variable de bloc : b</text>
    <text x="535" y="367" font-size="18">Déclarée à l'intérieur des accolades</text>
    <text x="535" y="392" font-size="18">du bloc orange. Inaccessible après</text>
    <text x="535" y="417" font-size="18">l'accolade qui ferme ce bloc.</text>
  </g>
</svg>
